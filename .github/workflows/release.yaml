name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: [self-hosted, solinas]

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_WORKFLOW_TOKEN }}
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install demo dependencies
        run: |
          npm --prefix demos/demo ci
          npm --prefix demos/el-demo ci

      - run: npm run type-check

      - run: npm run build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, and push
        run: |
          git add package.json package-lock.json
          git commit -m "chore(release): v${{ steps.bump.outputs.version }}"
          # Piper's githubPublishRelease step (Release stage) creates the
          # vX.Y.Z tag and the GitHub Release, so we only push the bump commit.
          git push origin main

      - name: Trigger Piper pipeline
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.RELEASE_WORKFLOW_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://github.tools.sap/api/v3/repos/${{ github.repository }}/actions/workflows/piper.yaml/dispatches \
            -d '{"ref":"main"}'
